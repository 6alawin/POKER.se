<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1000" viewBox="0 0 1400 1000" role="img" aria-labelledby="title desc">
  <title id="title">POKER.se Scrum Process — Week 1 to Week 6</title>
  <desc id="desc">Pixel-art Scrum process and roadmap through week 6 for the POKER.se project.</desc>
  <defs>
    <pattern id="pixels" width="48" height="48" patternUnits="userSpaceOnUse">
      <rect width="48" height="48" fill="#0b3025"/>
      <rect x="0" y="0" width="24" height="24" fill="#0d382a"/>
      <rect x="24" y="24" width="24" height="24" fill="#0d382a"/>
      <rect x="16" y="16" width="8" height="8" fill="#145139"/>
      <rect x="32" y="32" width="8" height="8" fill="#145139"/>
    </pattern>
    <style>
      .pixel{font-family:"Courier New",monospace}.title{font:700 42px "Courier New",monospace;letter-spacing:2px;fill:#ffe08a}.sub{font:700 16px "Courier New",monospace;fill:#aad3bd;letter-spacing:1px}.head{font:700 19px "Courier New",monospace;letter-spacing:1px;fill:#ffe08a}.body{font:700 15px "Courier New",monospace;fill:#f1f4db}.small{font:700 12px "Courier New",monospace;fill:#aad3bd}.dark{font:700 15px "Courier New",monospace;fill:#123126}.num{font:700 30px "Courier New",monospace;fill:#123126}
    </style>
  </defs>

  <rect width="1400" height="1000" fill="url(#pixels)"/>
  <rect x="24" y="24" width="1352" height="952" fill="none" stroke="#f0b83f" stroke-width="8"/>
  <rect x="40" y="40" width="1320" height="920" fill="none" stroke="#7a4a29" stroke-width="4" stroke-dasharray="12 8"/>

  <text x="70" y="96" class="title">POKER.se // SCRUM PROCESS</text>
  <text x="72" y="130" class="sub">PIXEL QUEST: FROM FOUNDATION TO A PLAYABLE TABLE</text>
  <line x1="70" y1="158" x2="1330" y2="158" stroke="#f0b83f" stroke-width="4"/>

  <text x="70" y="205" class="head">[ LOOP ] EVERY SPRINT FOLLOWS THE SAME RHYTHM</text>

  <!-- Pixel-art loop -->
  <g transform="translate(700 405)">
    <rect x="-122" y="-84" width="244" height="168" fill="#113d2d" stroke="#ffe08a" stroke-width="6"/>
    <rect x="-94" y="-56" width="188" height="112" fill="#08271e" stroke="#b7772b" stroke-width="4" stroke-dasharray="8 6"/>
    <text x="0" y="-5" text-anchor="middle" class="head">SPRINT</text>
    <text x="0" y="25" text-anchor="middle" class="body">BUILD</text>
    <text x="0" y="48" text-anchor="middle" class="body">INSPECT</text>
    <text x="0" y="71" text-anchor="middle" class="body">ADAPT</text>
    <!-- block arrows -->
    <path d="M-122-58h-46v18h-18v34h18v18h46" fill="none" stroke="#f0b83f" stroke-width="10"/>
    <path d="M122 58h46V40h18V6h-18V-12h-46" fill="none" stroke="#f0b83f" stroke-width="10"/>
    <path d="M-72-84v-42h18v-18h34v18h18v42" fill="none" stroke="#f0b83f" stroke-width="10"/>
    <path d="M72 84v42H54v18H20v-18H2V84" fill="none" stroke="#f0b83f" stroke-width="10"/>
  </g>

  <!-- event panels -->
  <g>
    <rect x="70" y="270" width="270" height="155" fill="#ffe9ad" stroke="#b7772b" stroke-width="6"/>
    <rect x="70" y="270" width="270" height="24" fill="#f0b83f"/>
    <text x="88" y="317" class="num">01</text><text x="138" y="315" class="dark">PLANNING</text>
    <text x="88" y="350" class="dark">Pick a sprint goal.</text><text x="88" y="375" class="dark">Prioritize what to build.</text><text x="88" y="405" class="small" fill="#35654e">CLEAR + TESTABLE</text>

    <rect x="1060" y="270" width="270" height="155" fill="#ffe9ad" stroke="#b7772b" stroke-width="6"/>
    <rect x="1060" y="270" width="270" height="24" fill="#f0b83f"/>
    <text x="1078" y="317" class="num">02</text><text x="1128" y="315" class="dark">STANDUP</text>
    <text x="1078" y="350" class="dark">Mon / Wed / Fri.</text><text x="1078" y="375" class="dark">Progress + blockers.</text><text x="1078" y="405" class="small">SYNC THE TEAM</text>

    <rect x="70" y="455" width="270" height="155" fill="#ffe9ad" stroke="#b7772b" stroke-width="6"/>
    <rect x="70" y="455" width="270" height="24" fill="#f0b83f"/>
    <text x="88" y="502" class="num">04</text><text x="138" y="500" class="dark">RETRO</text>
    <text x="88" y="535" class="dark">What worked?</text><text x="88" y="560" class="dark">What do we improve?</text><text x="88" y="590" class="small">INSPECT • LEARN • ADAPT</text>

    <rect x="1060" y="455" width="270" height="155" fill="#ffe9ad" stroke="#b7772b" stroke-width="6"/>
    <rect x="1060" y="455" width="270" height="24" fill="#f0b83f"/>
    <text x="1078" y="502" class="num">03</text><text x="1128" y="500" class="dark">REVIEW</text>
    <text x="1078" y="535" class="dark">Demo working software.</text><text x="1078" y="560" class="dark">Collect feedback.</text><text x="1078" y="590" class="small">WORKING INCREMENT</text>
  </g>

  <text x="70" y="684" class="head">[ ROADMAP ] WEEKS 1 → 6</text>
  <text x="70" y="712" class="small">The project stops here at Week 6, where the full-table milestone begins.</text>

  <!-- roadmap cards -->
  <g>
    <rect x="70" y="750" width="285" height="140" fill="#d9f0d6" stroke="#56b878" stroke-width="6"/>
    <text x="92" y="786" class="dark">SPRINT 1 // WEEK 1</text><text x="92" y="822" class="dark">Repo, infra, and</text><text x="92" y="848" class="dark">data layer ready.</text><rect x="92" y="866" width="76" height="8" fill="#56b878"/>

    <rect x="375" y="750" width="285" height="140" fill="#d9f0d6" stroke="#56b878" stroke-width="6"/>
    <text x="397" y="786" class="dark">SPRINT 2 // WEEK 2</text><text x="397" y="822" class="dark">Register, log in,</text><text x="397" y="848" class="dark">create / join table.</text><rect x="397" y="866" width="76" height="8" fill="#56b878"/>

    <rect x="680" y="750" width="285" height="140" fill="#d9f0d6" stroke="#56b878" stroke-width="6"/>
    <text x="702" y="786" class="dark">SPRINT 3 // WEEKS 3–5</text><text x="702" y="822" class="dark">Two players play</text><text x="702" y="848" class="dark">a full hand live.</text><rect x="702" y="866" width="76" height="8" fill="#56b878"/>

    <rect x="985" y="750" width="345" height="140" fill="#ffe09a" stroke="#e49d2e" stroke-width="8"/>
    <text x="1007" y="786" class="dark">SPRINT 4 // WEEK 6 START</text><text x="1007" y="822" class="dark">Scale toward a full</text><text x="1007" y="848" class="dark">4–10 player table.</text><text x="1007" y="875" class="small">(continues into Week 7)</text>
  </g>

  <rect x="70" y="920" width="1260" height="24" fill="#08271e" stroke="#f0b83f" stroke-width="3"/>
  <text x="700" y="938" text-anchor="middle" class="small">POKER.se • SF221 SOFTWARE PROCESS • SOURCE: README.md</text>
</svg>
